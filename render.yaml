services:
  # ── DiabetesCare AI Unified Fullstack Web Service ─────────────────────────
  - type: web
    name: diabetescare-ai-workstation
    env: python
    region: singapore          # Low-latency node for India
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      cd doctor-dashboard && npm install && npm run build && cd ..
    startCommand: |
      uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "*"
      - key: PYTHONPATH
        value: /opt/render/project/src
    healthCheckPath: /health
