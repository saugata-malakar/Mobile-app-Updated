services:
  # ── FastAPI Backend ────────────────────────────────────────────────────────
  - type: web
    name: diabetescare-ai-api
    env: python
    region: singapore          # closest to India
    plan: free
    buildCommand: |
      pip install -r requirements.txt
    startCommand: |
      uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: diabetescare-ai-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "*"
      - key: PYTHONPATH
        value: /opt/render/project/src
    healthCheckPath: /health

  # ── PostgreSQL Database ────────────────────────────────────────────────────
databases:
  - name: diabetescare-ai-db
    databaseName: diabetescare
    user: diabetescare_user
    plan: free
    region: singapore
