name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 cv ml backend tests --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 cv ml backend tests --count --exit-zero --max-complexity=12 --max-line-length=100 --statistics

      - name: Run pytest
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ cv/tests/ -v --cov=cv --cov=ml --cov=backend --cov-report=term-missing
